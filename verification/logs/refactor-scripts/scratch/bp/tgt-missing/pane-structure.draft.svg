<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="830" viewBox="0 0 1420 830"><rect width="100%" height="100%" fill="#ffffff"/><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
</defs><text x="40" y="44" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">구조: Claude Code 엔진과 mod 마다 따로 도는 worker</text><rect x="40" y="70" width="640" height="719" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="60" y="102" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Claude Code 엔진 (호스트 프로세스)</text><rect x="64" y="125" width="592" height="198" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="151" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">① ui.render 연쇄</text><text x="80" y="175" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">그리기 요청 1개 = pane 1개 (requestId)</text><text x="80" y="196" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">envelope(surface · component · requestId · viewport)는</text><text x="80" y="217" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">엔진이 정하고 hook 이 바꾸면 거부된다</text><text x="80" y="238" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">순서: @inline(--plugin-dir · CLAUDE_CODE_PLUGIN_DIRS)</text><text x="80" y="259" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">→ 설치본 → builtin → core</text><text x="80" y="280" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">설치본 순서: enabledPlugins 키 순서 (grid-and-tabs.md 7회차)</text><text x="80" y="301" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">next 를 부르지 않고 답하면 그보다 index 가 큰 hook 은 실행되지 않는다</text><rect x="64" y="339" width="592" height="110" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="365" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">② 반환 트리 검사</text><text x="80" y="389" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">상호작용 요소(Button · Input · Select)는</text><text x="80" y="410" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">그 요청 안에서 직접 그린 것과 next(e) 로 받은 것만 허용</text><text x="80" y="431" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">어기면 hook 실패 → 엔진이 대신 그린다</text><rect x="64" y="465" width="592" height="110" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="491" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">③ ui.press 처리</text><text x="80" y="515" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">트리의 Button 은 press: { plugin, handle } 만 갖는다</text><text x="80" y="536" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">core 가 handle 로 그린 mod 의 worker 에서 onPress 실행</text><text x="80" y="557" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">next() 에 다른 plugin · element 를 넣으면 거부</text><rect x="64" y="591" width="592" height="88" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="617" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">④ 그리기 요청 생성</text><text x="80" y="641" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">보이는 pane 1개에만 ui.render 요청을 만든다</text><text x="80" y="662" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">보이지 않는 pane(isShown false): 요청 없음 ($.ui.invalidate 를 불러도)</text><rect x="64" y="695" width="592" height="74" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="80" y="721" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">terminal 표면</text><text x="80" y="747" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">보이는 pane 1개 + 나머지는 탭 (분할 API 없음)</text><line x1="722" y1="155.0" x2="768" y2="155.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="110" width="610" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="788" y="137" font-family="Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker · 연쇄 index 0 · pane-grid@inline</text><text x="788" y="161" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">ui.render hook: 모든 Pane 요청을 받는다</text><text x="788" y="182" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">자기 onPress 함수는 이 worker 안에만 있다</text><line x1="722" y1="256.0" x2="768" y2="256.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="222" width="610" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="788" y="249" font-family="Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker · 연쇄 index 1 · usage-gauge</text><text x="788" y="273" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">next(e) 로 넘긴다</text><line x1="722" y1="346.0" x2="768" y2="346.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="312" width="610" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="788" y="339" font-family="Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker · 연쇄 index 2 · uhd-kanban</text><text x="788" y="363" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">next(e) 로 넘긴다</text><line x1="722" y1="436.0" x2="768" y2="436.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="402" width="610" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="788" y="429" font-family="Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker · 연쇄 index 3 · pending-questions</text><text x="788" y="453" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">requestId 'pending-questions' 는 직접 답한다</text><line x1="722" y1="537.0" x2="768" y2="537.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="492" width="610" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="788" y="519" font-family="Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker · 연쇄 index 4 · filetree (수정 불가 mod)</text><text x="788" y="543" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">requestId 'filetree' 는 next 를 부르지 않고 직접 답한다</text><text x="788" y="564" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">onPress 함수는 이 worker 안에만 있다</text><line x1="720" y1="110" x2="720" y2="537.0" stroke="#4b5563" stroke-width="2"/><text x="770" y="614" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">$ 호출 · 이벤트: worker 마다 MessagePort 1개.</text><text x="770" y="635" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">오가는 것은 순수 데이터뿐이고 함수는 넘어가지 않는다.</text><text x="770" y="656" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">worker 끼리는 직접 호출 · import · 메모리 공유가 없다.</text><text x="770" y="677" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">순서와 index 는 R1c 실행의 next.trace 와 debug log 에서 읽었다.</text></svg>